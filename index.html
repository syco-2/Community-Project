<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Project</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="loader-screen" id="loader-screen">
    <div class="loader">
      <span class="loader-text">loading</span>
      <span class="load"></span>
    </div>
  </div>

  <div class="app" id="app">
    <header class="site-header">
      <div class="header-row">
        <div class="brand">
          <h1 class="brand-title">Community Project</h1>
          <span class="brand-sub">made by syco</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button">Dark</button>
      </div>
      <!-- SPRUCH-PLATZHALTER -->
      <div class="slogan-slot" aria-hidden="true"></div>
    </header>

    <main class="library" id="library"></main>
  </div>

  <script src="data/apps.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
